[project]
name = "agri-agent"
version = "0.1.0"
description = "Conversational text-to-SQL agent over an agricultural PostgreSQL database"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "sqlglot>=25.30",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "pydantic>=2.9",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "openpyxl>=3.1",
    "huggingface-hub>=1.31.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["server", "eval"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
