# Bake-off roster. Every candidate is <=8B, open weights, GGUF, Q4_K_M, served
# by llama-server with identical flags so the comparison isolates the model.
#
# Footprint is weights only; add ~0.3 GB for a quantised 8192-token KV cache.
# On an 8 GB machine exactly one of these runs at a time.

defaults:
  quant: Q4_K_M
  ctx: 6144
  parallel: 1
  # n_gpu_layers is deliberately unset: on 8 GB, forcing it makes llama.cpp
  # abort its own memory fitting and generation drops from 5.9 to 3.5 tok/s.
  cache_type_k: q8_0
  cache_type_v: q8_0
  port: 8080
  temperature: 0.0
  seed: 1337

models:
  - id: qwen2.5-coder-7b
    name: Qwen2.5-Coder-7B-Instruct
    params: 7.6B
    repo: Qwen/Qwen2.5-Coder-7B-Instruct-GGUF
    file: qwen2.5-coder-7b-instruct-q4_k_m.gguf
    rationale: >
      Strongest open coder model in this size class for text-to-SQL.
      The expected winner, and the one the others have to beat.

  - id: qwen3-8b
    name: Qwen3-8B
    params: 8.2B
    repo: Qwen/Qwen3-8B-GGUF
    file: Qwen3-8B-Q4_K_M.gguf
    known_incompatible: >
      OOMs on 8 GB unified memory. Observed at ctx 6144 and ctx 4096:
      kIOGPUCommandBufferCallbackErrorOutOfMemory during decode. Because Metal
      shares memory with the window server, this destabilised the display.
      Not retried. Needs 16 GB.
    rationale: >
      Newer generation at the parameter ceiling. Tests whether a general model
      one generation on beats a coder-tuned model one generation back.

  - id: llama-3.1-8b
    name: Meta-Llama-3.1-8B-Instruct
    params: 8.0B
    repo: bartowski/Meta-Llama-3.1-8B-Instruct-GGUF
    file: Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
    known_incompatible: >
      OOMs on 8 GB unified memory, same failure as qwen3-8b. Needs 16 GB.
    rationale: >
      The general-purpose reference point. Strong instruction following,
      no SQL specialisation.

  - id: mistral-7b-v0.3
    name: Mistral-7B-Instruct-v0.3
    params: 7.2B
    repo: bartowski/Mistral-7B-Instruct-v0.3-GGUF
    file: Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
    rationale: >
      Older, leaner general model. Establishes how much of the result comes
      from recent training rather than from the scaffolding.

  - id: qwen2.5-coder-3b
    name: Qwen2.5-Coder-3B-Instruct
    params: 3.1B
    repo: Qwen/Qwen2.5-Coder-3B-Instruct-GGUF
    file: qwen2.5-coder-3b-instruct-q4_k_m.gguf
    rationale: >
      Speed and size floor. Answers the question the brief implies but does not
      ask: how much does going from 3B to 7B actually buy on this task?

  - id: sqlcoder-7b-2
    name: sqlcoder-7b-2
    params: 6.7B
    repo: MaziyarPanahi/sqlcoder-7b-2-GGUF
    file: sqlcoder-7b-2.Q4_K_M.gguf
    chat_capable: false
    known_incompatible: >
      Cannot compile the JSON schema to a GBNF grammar:
      "common_sampler_init: error initializing grammar sampler". A
      completion-style SQL model with no usable chat template, so it cannot
      take part in a structured conversational pipeline at all. This is a
      capability result, not a memory one - and it is exactly what including
      this model was meant to test.
    rationale: >
      Purpose-built text-to-SQL, but completion-style and weak at multi-turn
      chat. Included precisely to test the assignment's premise: on a
      CONVERSATIONAL benchmark, does SQL specialism beat conversational
      ability? Expected to score well on first turns and poorly on follow-ups.
